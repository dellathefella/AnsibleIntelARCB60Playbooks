---
# The "B60" is the Intel Arc Pro B60 (Battlemage G21) attached over Thunderbolt.
# Right now we drive it from the local machine (the P53 host that owns the eGPU).
#
# To run this against a REMOTE B60 later, comment the local block and use the ssh
# block instead. Nothing else in the role changes: the render node is auto-detected
# on whatever host you target.
all:
  children:
    b60_gpu:
      hosts:
        b60:
          ansible_connection: local
          ansible_python_interpreter: "{{ ansible_playbook_python }}"

          # --- Remote B60 (uncomment to go remote) ---
          # ansible_host: 192.168.50.2        # Thunderbolt / LAN address of the B60 host
          # ansible_user: jdella
          # ansible_connection: ssh
          # ansible_python_interpreter: /usr/bin/python3
