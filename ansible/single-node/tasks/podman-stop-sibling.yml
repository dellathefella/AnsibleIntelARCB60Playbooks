# =============================================================================
# podman-stop-sibling.yml
# One GPU, one track: stops the other tracks' containers before this track
# claims the device. Silent no-op for containers that are not present.
#
# Include with:
#   sibling_containers   list of container names of the other tracks ([] = none)
# =============================================================================
---
- name: Stop sibling track containers (one GPU, one track)
  ansible.builtin.command:
    cmd: "podman stop {{ item }}"
  loop: "{{ sibling_containers | default([]) }}"
  ignore_errors: true
  changed_when: false
  tags: [podman, deploy]
