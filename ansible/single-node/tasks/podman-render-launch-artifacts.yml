# =============================================================================
# podman-render-launch-artifacts.yml
# Renders the manual launch script (~/scripts/<track_stem>-start.sh) and the
# opencode config (rendered/opencode-configs/opencode-<track_stem>-podman.json).
#
# Include with:
#   track_stem   stem shared by the templates and rendered filenames —
#                templates/scripts/{{ track_stem }}-start.sh.j2
#                templates/opencode-configs/opencode-{{ track_stem }}-podman.json.j2
#   _user_home   remote user's home dir
# =============================================================================
---
- name: Ensure scripts directory exists on host
  ansible.builtin.file:
    path: "{{ _user_home }}/scripts"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  tags: [podman, launch]

- name: "Render launch script into ~/scripts/ ({{ track_stem ~ '-start.sh' }})"
  # owner/group: plays run with become: true, so without these the rendered
  # script lands root:root on the target host (it must stay user-owned so
  # the user can edit/run it without sudo).
  ansible.builtin.template:
    src: "templates/scripts/{{ track_stem }}-start.sh.j2"
    dest: "{{ _user_home }}/scripts/{{ track_stem }}-start.sh"
    mode: "0755"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
  tags: [podman, launch]

- name: Ensure opencode-configs output directory exists on controller
  ansible.builtin.file:
    path: "{{ playbook_dir }}/rendered/opencode-configs"
    state: directory
    mode: "0755"
  delegate_to: localhost
  become: false
  tags: [podman, launch]

- name: "Render opencode config into rendered/opencode-configs/ ({{ 'opencode-' ~ track_stem ~ '-podman.json' }})"
  ansible.builtin.template:
    src: "templates/opencode-configs/opencode-{{ track_stem }}-podman.json.j2"
    dest: "{{ playbook_dir }}/rendered/opencode-configs/opencode-{{ track_stem }}-podman.json"
    mode: "0644"
  delegate_to: localhost
  become: false
  tags: [podman, launch]
