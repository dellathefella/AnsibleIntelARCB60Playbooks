---
# =============================================================================
# qwen38-27b-vllm-xpu-tp4-podman.yml
# Qwen3.8-27B (AWQ W4A16, safetensors) — vLLM via Podman, Intel XPU backend,
# TENSOR PARALLEL across four Arc Pro B60 cards.
#
#   image           docker.io/vllm/vllm-openai-xpu:latest (PULLED, never built)
#   model           philbert440/Qwen3.8-27B-W4A16-AWQ (compressed-tensors, 18.2 GiB)
#   backend         XPU (Level-Zero), xccl allreduce — REQUIRES Resizable BAR.
#                 TP=4 splits the 18.2 GiB weights to ~4.6 GiB/card; fp8 paged
#                 KV across four cards fits the model's native 262144 ctx.
#   devices         ZE_AFFINITY_MASK=0,1,2,3 (all four cards)
#   power           {{ power_limit_watts }} W/card burst cap via
#                 xpu-powerlimit.service (shared power conditioner on arcflash)
#   API             OpenAI-compatible /v1/* + /health on port {{ host_port }}
#   launch script   ~/scripts/{{ track_stem }}-start.sh
#
# Measured on arcflash (4x B60, 150 W/card):
#   decode  ~59 t/s short with the qwen3 reasoning parser (~66 t/s
#           without), 55 t/s @ 6.9k ctx, 36.7 t/s @ 124k ctx
#   prefill 2,447 t/s @ 18k, 1,591 t/s @ 124k
#   aggregate 358 t/s @ c8, 506 t/s @ c32
#   vs the FP8 TP=4 baseline: ~2x decode, ~1.4x prefill.
#
# MTP speculative decoding is deliberately OFF: on AWQ W4A16 the draft layer
# costs more than it saves (54 t/s with MTP vs 66 t/s plain at short context).
#
# One GPU set, one track: this track stops every sibling container before
# claiming the four devices.
# =============================================================================

- name: "vLLM XPU TP=4 — Qwen3.8-27B (AWQ W4A16) on 4x Arc B60"
  hosts: xpu4
  gather_facts: true
  become: true
  tags: [qwen38-27b-vllm-xpu-tp4-podman]
  vars:
    # =====================================================================
    # Qwen3.8-27B vLLM XPU TP4 track vars — self-contained, no group_vars
    # =====================================================================
    track_stem: "qwen38-27b-vllm-xpu-tp4"

    docker_image: "docker.io/vllm/vllm-openai-xpu:latest"
    docker_container_name: "qwen38-27b-vllm-xpu-tp4"
    sibling_containers:
      - "qwen38-27b-sycl"
      - "qwen36-a3b-moe"
      - "qwen36-a3b-escha-w2"
      - "qwen38-27b-sycl-tuned"
      - "qwen38-27b-vllm-xpu"
      - "qwen38-27b-vllm-xpu-tp2"
      # ad-hoc container used before this track existed on arcflash
      - "vllm-xpu-qwen38"

    hf_repo: "philbert440/Qwen3.8-27B-W4A16-AWQ"
    served_model_name: "qwen3.8-27b"

    tp_size: 4
    xpu_visible_devices: "0,1,2,3"
    xpu_device_count: 4
    _min_xpu_devices: 4

    # 262144 = the model's native max. TP=4 leaves ~19 GiB/card for fp8 KV,
    # so the full 262k window fits with room for concurrent requests.
    ctx: 262144
    host_port: 8081
    gpu_mem_util: "0.93"
    kv_cache_dtype: "fp8"
    dtype: "float16"
    max_num_batched_tokens: 32768
    max_num_seqs: 32

    # Shared power conditioner: cap each card so the rig cannot pop it.
    power_limit_watts: 150

    _user_home: "/home/{{ ansible_user }}"
    _models_dir: "{{ _user_home }}/.local/share/b60-llama/models"
    _repo_dir: "{{ _models_dir }}/Qwen3.8-27B-W4A16-AWQ"
    _container_repo_dir: "/models/Qwen3.8-27B-W4A16-AWQ"

    hf_token_lookup: "{{ lookup('file', playbook_dir + '/../secrets/hf_token.txt', errors='ignore') | default('', true) | trim }}"

    # vLLM server arguments. NOTE: the image entrypoint is already `vllm serve`
    # — do NOT add a `serve` subcommand here; the model is the first positional.
    _vllm_args: >-
      {{ _container_repo_dir }}
      --served-model-name {{ served_model_name }}
      --tensor-parallel-size {{ tp_size }}
      --max-model-len {{ ctx }}
      --gpu-memory-utilization {{ gpu_mem_util }}
      --kv-cache-dtype {{ kv_cache_dtype }}
      --max-num-batched-tokens {{ max_num_batched_tokens }}
      --max-num-seqs {{ max_num_seqs }}
      --dtype {{ dtype }}
      --enable-prefix-caching
      --enable-auto-tool-choice --tool-call-parser qwen3_xml
      --reasoning-parser qwen3
      --limit-mm-per-prompt '{"image": 0}'
      --host 0.0.0.0 --port {{ host_port }}

    # Everything after `podman run -d --name`, shared between the deployment
    # and the manual debug hint — keeps them from drifting.
    _podman_common_args: >-
      --rm
      --device /dev/dri
      --security-opt label=disable
      --ipc=host
      -v {{ _repo_dir }}:{{ _container_repo_dir }}:ro
      -e ZE_AFFINITY_MASK={{ xpu_visible_devices }}
      -e HF_HUB_OFFLINE=1
      -p {{ host_port }}:{{ host_port }}
      {{ docker_image }}
      {{ _vllm_args }}

    # TP=4 cold start: four workers, oneCCL rendezvous, weight load, torch
    # compile and CUDA-graph capture — slower than the TP=2 track.
    podman_health_retries: 240

    # opencode config (rendered to the controller)
    opencode_provider_id: "qwen-arc-vllm-tp4"
    # Must equal served_model_name: opencode sends this id as the `model`
    # param and vLLM 404s on anything it doesn't serve.
    opencode_model_id: "qwen3.8-27b"
    opencode_provider_name: "Qwen 3.8 27B vLLM-XPU TP4 (4x Arc B60)"
    opencode_model_name: "Qwen 3.8 27B (AWQ W4A16, vLLM XPU, TP=4)"
    opencode_context_limit: 262144
    opencode_output_limit: 8192

  tasks:
    # -----------------------------------------------------------------------
    # 1. ReBAR gate (mandatory) + torch XPU probe
    # -----------------------------------------------------------------------
    - name: Resolve render node, PCI id, ReBAR window (mandatory)
      ansible.builtin.include_tasks: tasks/rebar-gate.yml

    - name: Probe torch XPU devices (pulls the image if missing)
      ansible.builtin.command:
        cmd: >-
          podman run --rm --device /dev/dri --security-opt label=disable
          --entrypoint /bin/bash {{ docker_image }}
          -lc 'python3 -c "import torch; print(torch.xpu.device_count(), torch.xpu.get_device_name(0))"'
      register: xpu_probe
      changed_when: false
      failed_when: false
      tags: [podman, gate]

    - name: Assert enough torch XPU devices for TP={{ tp_size }}
      ansible.builtin.assert:
        that:
          - xpu_probe.rc == 0
          - (xpu_probe.stdout | default('')).split(' ')[0] | int >= _min_xpu_devices
        fail_msg: >-
          torch.xpu sees fewer than {{ _min_xpu_devices }} devices inside the
          vLLM XPU image (got: {{ xpu_probe.stdout | default('?') }}).
          TP={{ tp_size }} with ZE_AFFINITY_MASK={{ xpu_visible_devices }}
          needs those device indices present. Check the xe driver, ReBAR,
          and /dev/dri on this host.
        success_msg: "XPU devices: {{ xpu_probe.stdout | default('?') }}"
      tags: [podman, gate]

    # -----------------------------------------------------------------------
    # 2. Power cap (shared power conditioner)
    # -----------------------------------------------------------------------
    - name: Cap each card's burst power limit
      ansible.builtin.include_tasks: tasks/xpu-powerlimit.yml
      tags: [podman, power]

    # -----------------------------------------------------------------------
    # 3. Model (whole-repo download + verify; same artifact as the other
    #    vLLM tracks, so this is a no-op when it ran before)
    # -----------------------------------------------------------------------
    - name: Set up models directory
      ansible.builtin.include_tasks: tasks/podman-models-dir.yml

    - name: Download the AWQ safetensors repo if not present
      ansible.builtin.include_tasks: tasks/hf-download-repo.yml

    # -----------------------------------------------------------------------
    # 4. Create and run the Podman container
    # -----------------------------------------------------------------------
    - name: Stop the sibling tracks (one GPU set, one track)
      ansible.builtin.include_tasks: tasks/podman-stop-sibling.yml

    - name: Remove any existing container
      ansible.builtin.include_tasks: tasks/podman-remove-container.yml

    - name: Run vLLM container (Podman, XPU, TP={{ tp_size }})
      ansible.builtin.command:
        cmd: "podman run -d --name {{ docker_container_name }} {{ _podman_common_args }}"
      register: podman_run_result
      changed_when: "'Started' in podman_run_result.stdout or podman_run_result.rc == 0"
      tags: [podman, deploy]

    - name: Check container status
      ansible.builtin.include_tasks: tasks/podman-check-running.yml

    - name: Print container failure info
      ansible.builtin.debug:
        msg: |
          Container {{ docker_container_name }} is NOT running or was removed (has --rm flag).

          To debug, run manually:
            podman run -it {{ _podman_common_args }}

          Check GPU access: ls -la /dev/dri/
          Check ReBAR window: cat /sys/bus/pci/devices/{{ b60_pci_id }}/resource
      when: container_check.stdout | default('') | length == 0
      tags: [podman, deploy]

    - name: Wait for the server to come up
      ansible.builtin.include_tasks: tasks/podman-wait-health.yml

    # -----------------------------------------------------------------------
    # 5. Warm the decode path (XPU kernel JIT) before serving traffic
    # -----------------------------------------------------------------------
    - name: Warm up the decode path
      ansible.builtin.include_tasks: tasks/podman-warmup.yml

    # -----------------------------------------------------------------------
    # 6. Write launch script + opencode config
    # -----------------------------------------------------------------------
    - name: Render launch script + opencode config
      ansible.builtin.include_tasks: tasks/podman-render-launch-artifacts.yml

    - name: Print deployment summary
      ansible.builtin.debug:
        msg: |
          ==== vLLM (Podman, XPU, TP={{ tp_size }}) deployed on {{ inventory_hostname }} ====
          Image: {{ docker_image }} (pulled)
          Container: {{ docker_container_name }}
          Devices: ZE_AFFINITY_MASK={{ xpu_visible_devices }} (TP={{ tp_size }})
          Power: {{ power_limit_watts }} W/card burst cap (xpu-powerlimit.service)
          API endpoint: http://{{ ansible_host | default(inventory_hostname) }}:{{ host_port }}/v1
          Model: {{ _repo_dir }} ({{ hf_repo }})
          Context: {{ ctx }} (AWQ W4A16, fp8 KV, gpu-mem-util {{ gpu_mem_util }})
          Batching: max-num-batched-tokens {{ max_num_batched_tokens }}, max-num-seqs {{ max_num_seqs }}
          Speculative decoding: off (MTP is slower on AWQ W4A16)
          Launch script: ~/scripts/{{ track_stem }}-start.sh

          === Container log commands ===
          View logs:  podman logs -f {{ docker_container_name }}
          Tail last 100 lines:  podman logs --tail 100 {{ docker_container_name }}
          View since startup:  podman logs --since 24h {{ docker_container_name }}
      tags: [podman, deploy]
