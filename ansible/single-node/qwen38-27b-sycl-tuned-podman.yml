---
# =============================================================================
# qwen38-27b-sycl-tuned-podman.yml
# Qwen3.8-27B (IQ3_S→Q4_K tuned GGUF, MTP draft head) — llama.cpp via Podman,
# SYCL/Level-Zero backend, B60 KERNEL-TUNED IMAGE (built on the host).
#
#   image           localhost/llama.cpp:b60-tuned (BUILT here from
#                   kernel-work/Dockerfile.tuned — the only track that builds)
#   kernel mods     1) ESIMD weight-streaming loads (oneAPI 2026 property
#                      hints L1 uncached + L2 uncached): the per-token weight
#                      re-read bypasses the caches entirely (it comes from
#                      DRAM anyway), keeping cache for KV / activations.
#                   2) safe fast-math subset (-fno-math-errno
#                      -fno-signed-zeros -fno-trapping-math -ffp-contract=fast;
#                      ~+5-8% decode, without the finite-math-only UB of full
#                      -ffast-math).
#                   Patch: kernel-work/patches/0001-*.patch on upstream
#                   llama.cpp @ 5fc4f3c.
#   model           Qwen3.8-27B-GSQ-RCO-IQ3_S-Intel-Arc-Tuned-MTP-Q4_K.gguf
#                   (same weights as the stock 27B track — A/B is kernels only)
#   backend         SYCL/Level-Zero — REQUIRES Resizable BAR (rebar-gate).
#   API             OpenAI-compatible /v1/* + /health on port 8186
#   launch script   ~/scripts/qwen38-27b-sycl-tuned-start.sh
#
# A/B vs the stock track: benchmarks/ab_bench.py --a :8183 --b :8186
#
# One GPU, one track: stops all sibling track containers before claiming the
# device.
# =============================================================================

- name: "llama.cpp SYCL (B60 kernel-tuned) — Qwen3.8-27B (IQ3_S→Q4_K + MTP) on Arc B60"
  hosts: sycl
  gather_facts: true
  become: true
  tags: [qwen38-27b-sycl-tuned-podman]
  vars:
    # =====================================================================
    # Qwen3.8-27B SYCL *tuned* track vars — self-contained, no group_vars
    # =====================================================================
    track_stem: "qwen38-27b-sycl-tuned"

    docker_image: "localhost/llama.cpp:b60-tuned"
    docker_container_name: "qwen38-27b-sycl-tuned"
    sibling_containers: ["qwen38-27b-sycl", "qwen36-a3b-moe", "qwen38-27b-vllm-xpu", "qwen36-a3b-escha-w2"]

    # Build inputs (kernel-work/ lives at the repo root, two levels above this play)
    kernel_work_src: "{{ playbook_dir }}/../../kernel-work"
    build_dir: "{{ _user_home }}/build/b60-tuned"
    llama_upstream_sha: "5fc4f3c"
    # Set -e force_build=true to rebuild even if the image already exists
    force_build: false

    hf_repo: "Greatjedi/Qwen3.8-27B-Intel-Arc-Tuned-GGUF"
    model: "Qwen3.8-27B-GSQ-RCO-IQ3_S-Intel-Arc-Tuned-MTP-Q4_K.gguf"
    model_sha256: "2170ff045d36dfa1ac5cad5a9f4f1945f5a784a93466a0449dbb6ed8ec1eacce"
    model_size: 15359440960

    ctx: 200000
    host_port: 8186

    n_gpu_layers: 99
    flash_attn: "on"
    batch_size: 1024
    ubatch_size: 1024
    threads: 4
    threads_batch: 6
    cache_type_k: q4_0
    cache_type_v: q4_0
    parallel_slots: 1

    # Same MTP speculation as the stock 27B track (draft-n-max 5 sweet spot)
    enable_speculative: true
    spec_type: "ngram-mod,draft-mtp"
    spec_ngram_mod_n_match: 24
    spec_ngram_mod_n_min: 1
    spec_ngram_mod_n_max: 5
    spec_draft_n_max: 5
    spec_draft_p_min: 0.5

    # Directories — plays run with become: true, so ansible_env.HOME would be
    # /root. Use ansible_user (the original login user) for the home dir.
    _user_home: "/home/{{ ansible_user }}"
    _models_dir: "{{ _user_home }}/.local/share/b60-llama/models"
    _container_models_dir: "/models"

    # Model download settings — token read on the controller ("" => public)
    hf_token_lookup: "{{ lookup('file', playbook_dir + '/../secrets/hf_token.txt', errors='ignore') | default('', true) | trim }}"
    hf_download_items:
      - { repo: "{{ hf_repo }}", file: "{{ model }}", dest_dir: "{{ _models_dir }}" }

    # llama-server arguments — identical to the stock 27B track so the A/B
    # isolates the kernel changes.
    _llama_args: >-
      -m {{ _container_models_dir }}/{{ model }}
      -ngl {{ n_gpu_layers }} -fa {{ flash_attn }}
      -c {{ ctx }} -b {{ batch_size }} -ub {{ ubatch_size }}
      -t {{ threads }} -tb {{ threads_batch }}
      -ctk {{ cache_type_k }} -ctv {{ cache_type_v }}
      {%- if enable_speculative | bool %}
        --spec-type {{ spec_type }}
        --spec-ngram-mod-n-match {{ spec_ngram_mod_n_match }}
        --spec-ngram-mod-n-min {{ spec_ngram_mod_n_min }}
        --spec-ngram-mod-n-max {{ spec_ngram_mod_n_max }}
        --spec-draft-n-max {{ spec_draft_n_max }}
        --spec-draft-p-min {{ spec_draft_p_min }}
      {%- endif %}
      {%- if parallel_slots | int > 0 %} --parallel {{ parallel_slots }} {%- endif %}
      --host 0.0.0.0 --port {{ host_port }}

    # Everything after `podman run -d --name`, shared between the deployment
    # and the manual debug hint — keeps them from drifting.
    _podman_common_args: >-
      --rm
      --device /dev/dri
      --security-opt label=disable
      -v {{ _models_dir }}:{{ _container_models_dir }}:ro
      -e UR_LOADER_USE_LEVEL_ZERO_V2=0
      -e ONEAPI_DEVICE_SELECTOR=level_zero:0
      -e ZE_AFFINITY_MASK=0
      -p {{ host_port }}:{{ host_port }}
      --entrypoint /app/llama-server
      {{ docker_image }}
      {{ _llama_args }}

    # 200k ctx + 14 GB cold SYCL load takes minutes; allow ~10 min of retries.
    podman_health_retries: 120

    # opencode config (rendered to the controller)
    opencode_provider_id: "qwen-arc-tuned"
    opencode_model_id: "qwen3.8-27b-tuned"
    opencode_provider_name: "Qwen 3.8 27B (Arc B60, kernel-tuned)"
    opencode_model_name: "Qwen 3.8 27B (IQ3_S→Q4_K + MTP, B60 kernel tuning)"
    opencode_context_limit: 200000
    opencode_output_limit: 8192

  tasks:
    # -----------------------------------------------------------------------
    # 0. Build the kernel-tuned image on the GPU host (idempotent)
    # -----------------------------------------------------------------------
    - name: Check whether the tuned image already exists
      ansible.builtin.command:
        cmd: "podman image exists {{ docker_image }}"
      register: tuned_image_check
      failed_when: false
      changed_when: false
      tags: [podman, build]

    - name: Remove stale build context (prevents old patches accumulating)
      ansible.builtin.file:
        path: "{{ build_dir }}"
        state: absent
      when: force_build | bool or tuned_image_check.rc != 0
      tags: [podman, build]

    - name: Create build directory on host
      ansible.builtin.file:
        path: "{{ build_dir }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0755"
      when: force_build | bool or tuned_image_check.rc != 0
      tags: [podman, build]

    - name: Copy kernel-work build context (Dockerfile.tuned + patches) to host
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "{{ build_dir }}/"
        mode: "0644"
      loop:
        - "{{ kernel_work_src }}/Dockerfile.tuned"
        - "{{ kernel_work_src }}/patches"
      when: force_build | bool or tuned_image_check.rc != 0
      tags: [podman, build]

    - name: Build the B60-tuned llama.cpp image (oneAPI base pull + SYCL compile)
      ansible.builtin.command:
        cmd: >-
          podman build -t {{ docker_image }}
          --build-arg UPSTREAM_SHA={{ llama_upstream_sha }}
          -f Dockerfile.tuned .
        chdir: "{{ build_dir }}"
      register: tuned_build
      changed_when: tuned_build.rc == 0
      # cold base-image pull + SYCL compile: allow up to 2 h
      timeout: 7200
      when: force_build | bool or tuned_image_check.rc != 0
      tags: [podman, build]

    # -----------------------------------------------------------------------
    # 1. ReBAR gate (mandatory) + SYCL probe
    # -----------------------------------------------------------------------
    - name: Resolve render node, PCI id, ReBAR window (mandatory)
      ansible.builtin.include_tasks: tasks/rebar-gate.yml

    - name: Probe SYCL/Level-Zero device inside the tuned image
      ansible.builtin.include_tasks: tasks/sycl-probe.yml

    # -----------------------------------------------------------------------
    # 2. Model (download + verify) — same weights as the stock 27B track
    # -----------------------------------------------------------------------
    - name: Set up models directory
      ansible.builtin.include_tasks: tasks/podman-models-dir.yml

    - name: Download the tuned GGUF if not present
      ansible.builtin.include_tasks: tasks/hf-download-files.yml

    - name: Verify model size + sha256
      ansible.builtin.include_tasks: tasks/model-verify-sha.yml

    # -----------------------------------------------------------------------
    # 3. Create and run the Podman container
    # -----------------------------------------------------------------------
    - name: Stop the sibling tracks (one GPU, one track)
      ansible.builtin.include_tasks: tasks/podman-stop-sibling.yml

    - name: Remove any existing container
      ansible.builtin.include_tasks: tasks/podman-remove-container.yml

    - name: Run llama.cpp container (Podman, SYCL, B60-tuned)
      ansible.builtin.command:
        cmd: "podman run -d --name {{ docker_container_name }} {{ _podman_common_args }}"
      register: podman_run_result
      changed_when: "'Started' in podman_run_result.stdout or podman_run_result.rc == 0"
      tags: [podman, deploy]

    - name: Check container status
      ansible.builtin.include_tasks: tasks/podman-check-running.yml

    - name: Print container failure info
      ansible.builtin.debug:
        msg: |
          Container {{ docker_container_name }} is NOT running or was removed (has --rm flag).

          To debug, run manually:
            podman run -it {{ _podman_common_args }}

          Check GPU access: ls -la /dev/dri/
          Check ReBAR window: cat /sys/bus/pci/devices/{{ b60_pci_id }}/resource
      when: container_check.stdout | default('') | length == 0
      tags: [podman, deploy]

    - name: Wait for the server to come up
      ansible.builtin.include_tasks: tasks/podman-wait-health.yml

    # -----------------------------------------------------------------------
    # 4. Write launch script + opencode config
    # -----------------------------------------------------------------------
    - name: Render launch script + opencode config
      ansible.builtin.include_tasks: tasks/podman-render-launch-artifacts.yml

    - name: Print deployment summary
      ansible.builtin.debug:
        msg: |
          ==== llama.cpp (Podman, SYCL, B60 kernel-tuned) deployed on {{ inventory_hostname }} ====
          Image: {{ docker_image }} (built from kernel-work/Dockerfile.tuned @ {{ llama_upstream_sha }})
          Kernel mods: ESIMD weight-streaming loads (L1/L2 bypass), safe fast-math
          Container: {{ docker_container_name }}
          API endpoint: http://{{ ansible_host | default(inventory_hostname) }}:{{ host_port }}/v1
          Model: {{ _models_dir }}/{{ model }}
          Context: {{ ctx }} (MTP + ngram-mod speculation, draft-n-max {{ spec_draft_n_max }})
          Launch script: ~/scripts/{{ track_stem }}-start.sh

          A/B vs the stock track (8183):
            python3 benchmarks/ab_bench.py --a http://{{ ansible_host | default(inventory_hostname) }}:8183 --b http://{{ ansible_host | default(inventory_hostname) }}:{{ host_port }} --reps 9

          === Container log commands ===
          View logs:  podman logs -f {{ docker_container_name }}
          Tail last 100 lines:  podman logs --tail 100 {{ docker_container_name }}
          View since startup:  podman logs --since 24h {{ docker_container_name }}
      tags: [podman, deploy]
