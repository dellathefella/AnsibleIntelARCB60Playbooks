---
- name: Default the track
  ansible.builtin.set_fact:
    llama_track: "{{ track | default(active_track) }}"

- name: Apply track overrides
  ansible.builtin.set_fact:
    "{{ item.key }}": "{{ item.value }}"
  loop: "{{ tracks[llama_track] | dict2items }}"

- name: Preflight (podman, render node, backend selection)
  ansible.builtin.import_tasks: preflight.yml

- name: Model (download + verify)
  ansible.builtin.import_tasks: model.yml

- name: Service (detached podman container)
  ansible.builtin.import_tasks: service.yml

- name: opencode config output
  ansible.builtin.import_tasks: opencode.yml
