---
- name: Resolve model facts from profile
  ansible.builtin.set_fact:
    model_file:   "{{ model_profiles[model_profile].file }}"
    model_sha256: "{{ model_profiles[model_profile].sha256 }}"
    model_size:   "{{ model_profiles[model_profile].size }}"

- name: Derive model URL and path
  ansible.builtin.set_fact:
    model_url:  "https://huggingface.co/{{ model_repo }}/resolve/main/{{ model_file }}"
    model_path: "{{ models_dir }}/{{ model_file }}"

- name: Check for existing model file
  ansible.builtin.stat:
    path: "{{ model_path }}"
  register: model_stat

- name: Remove partial or mismatched model before (re)download
  ansible.builtin.file:
    path: "{{ model_path }}"
    state: absent
  when:
    - download_model | bool
    - model_stat.stat.exists
    - (model_stat.stat.size | int) != (model_size | int)

- name: Download model (resumable)
  ansible.builtin.command:
    cmd: >-
      curl -fL --retry 3 --retry-delay 2 -C -
      -o '{{ model_path }}' '{{ model_url }}'
  when:
    - download_model | bool
    - not model_stat.stat.exists or (model_stat.stat.size | int) != (model_size | int)
  changed_when: true

- name: Verify model checksum
  ansible.builtin.stat:
    path: "{{ model_path }}"
    checksum_algorithm: sha256
    get_checksum: true
  register: model_check
  failed_when:
    - model_check.stat.exists
    - (model_sha256 | length) > 0
    - model_check.stat.checksum != model_sha256

- name: Model ready
  ansible.builtin.debug:
    msg: "model: {{ model_file }} ({{ 'present' if model_check.stat.exists else 'MISSING' }})"
