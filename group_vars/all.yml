---
# ============================================================================
#  B60 (Intel Arc Pro B60) + Qwen 3.8 27B  —  single tunable file
#  llama.cpp served as a detached Podman container. Backend auto-selects SYCL vs Vulkan.
# ============================================================================

# ---- Backend selection -------------------------------------------------------
# auto   -> prefer SYCL/Level-Zero (fastest, needs Resizable BAR); fall back to
#           Vulkan (works without ReBAR, e.g. Thunderbolt eGPU).
# sycl   -> force SYCL (full-intel image). Fails if no level_zero:gpu device.
# vulkan -> force Vulkan (server-vulkan image).
llama_backend: auto

# Images (pinned families; override the tag to lock a build)
llama_image_sycl:   ghcr.io/ggml-org/llama.cpp:full-intel
llama_image_vulkan: ghcr.io/ggml-org/llama.cpp:server-vulkan

# ---- Tracks ------------------------------------------------------------------
# Two model tracks share the one GPU (mutually exclusive at runtime; each track's
# control script stops its sibling before starting). Deploy by tag:
#   ansible-playbook site.yml --tags dense            # provision dense only
#   ansible-playbook site.yml --tags moe -e active_track=moe   # provision+run MoE
#   ansible-playbook site.yml                         # provision both, start active_track
active_track: dense

tracks:
  dense:
    model_repo: Greatjedi/Qwen3.8-27B-Intel-Arc-Tuned-GGUF
    model_profile: q4k
    service_name: llama-b60
    api_port: 8183
    ctx_size: 200000
    sibling_service: llama-b60-moe
    opencode_provider_id: qwen-arc
    opencode_model_id: qwen3.8-27b
    opencode_provider_name: "Qwen 3.8 27B (Arc B60)"
    opencode_context_limit: 200000
  moe:
    # unsloth UD-Q4_K_S: 0 IQ tensors + MTP head (header-verified). Fastest
    # decode on this rig (~39-40 t/s). For max context instead, switch to
    # model_profile a3b_q3kl (bartowski Q3_K_L, 16.6 GiB) + ctx_size 131072.
    model_repo: unsloth/Qwen3.6-35B-A3B-MTP-GGUF
    model_profile: a3b_q4ks
    service_name: llama-b60-moe
    api_port: 8184
    # 19.9 GiB weights leave ~1.1 GiB -> 32k is the VRAM ceiling with q4_0 KV.
    ctx_size: 32768
    sibling_service: llama-b60
    opencode_provider_id: qwen-arc-moe
    opencode_model_id: qwen3.6-35b-a3b
    opencode_provider_name: "Qwen 3.6 35B A3B MoE (Arc B60)"
    opencode_context_limit: 32768

# ---- Model -----------------------------------------------------------------
model_repo: Greatjedi/Qwen3.8-27B-Intel-Arc-Tuned-GGUF

# Pick one: q4k (best on 24GB) | bpw37 (headroom) | bpw32 (16GB cards)
model_profile: q4k

# sha256 == the HuggingFace LFS oid, so downloads are verified + idempotent.
model_profiles:
  q4k:
    file: Qwen3.8-27B-GSQ-RCO-IQ3_S-Intel-Arc-Tuned-MTP-Q4_K.gguf
    sha256: 2170ff045d36dfa1ac5cad5a9f4f1945f5a784a93466a0449dbb6ed8ec1eacce
    size: 15359440960
  bpw37:
    file: Qwen3.8-27B-GSQ-RCO-Intel-Arc-Tuned-MTP-3.7BPW.gguf
    sha256: 6bfcd4b6627ac9d77a793070039d21c4ebb8a63261e3a35decf2e1a50ab9bde5
    size: 12767103744
  bpw32:
    file: Qwen3.8-27B-GSQ-RCO-Intel-Arc-Tuned-MTP-3.2BPW.gguf
    sha256: d512b0a6f668be4eba0b41ef23f7e67057e83d66a9843ae1e3c46eb4b876015b
    size: 11239541504
  # MoE track candidates (header-verified: 0 IQ tensors, NextN/MTP head present)
  a3b_q3kl:   # max-context pick (16.6 GiB -> ~128k ctx with q4_0 KV)
    file: Qwen_Qwen3.6-35B-A3B-Q3_K_L.gguf
    sha256: 8fecfc2c33a3f78f37cab7c1d1684c0ee28fa983058d68a8b3f36a440a0e9909
    size: 17777899136
  a3b_q4ks:   # max-quality alt (19.9 GiB -> ~32k ctx)
    file: Qwen3.6-35B-A3B-UD-Q4_K_S.gguf
    sha256: 2bee952b218e4a481430c59d8d3bdc7bae20bed0eb501326340c5fca7ae95d42
    size: 21388319008

# Vision / multimodal projector. The repo ships NO mmproj file, so this stays off.
# If you drop an mmproj-*.gguf into the models dir, set enable_vision + mmproj_file.
enable_vision: false
mmproj_file: ""

# ---- Paths -----------------------------------------------------------------
b60_home:     "{{ ansible_env.HOME }}/.local/share/b60-llama"
models_dir:   "{{ b60_home }}/models"
scripts_dir:  "{{ ansible_env.HOME }}/scripts"

# ---- Service / API ---------------------------------------------------------
service_name: llama-b60
api_host: "127.0.0.1"
api_port: 8183

# ---- Runtime tuning (shared across backends) -------------------------------
ctx_size:      200000     # 200k context fits 24GB with q4_0 KV (per author's bench)
n_gpu_layers:  99         # offload everything
flash_attn:    "on"
batch_size:    1024       # -b
ubatch_size:   1024       # -ub
threads:       4          # -t   (generation)
threads_batch: 6          # -tb  (prompt/batch)
cache_type_k:  q4_0       # -ctk
cache_type_v:  q4_0       # -ctv

# ---- Speculative decoding (MTP draft head + ngram-mod) ---------------------
# The tuned GGUFs keep the Layer-64 NextN draft head in Q6_K, so MTP works with
# no separate draft model.
# Measured on this rig: draft-n-max 5 gives 98-100% acceptance and the best
# decode (~31-32 t/s). 8 does NOT fit in VRAM at 200k ctx (OOM). Dropping
# ngram-mod costs ~25% decode — keep both.
enable_speculative:    true
spec_type:             "ngram-mod,draft-mtp"
spec_ngram_mod_n_match: 24
spec_ngram_mod_n_min:   1
spec_ngram_mod_n_max:   5
spec_draft_n_max:       5
spec_draft_p_min:       0.5

# ---- Vulkan backend knobs ---------------------------------------------------
# No-ReBAR workaround (Thunderbolt eGPU): host-visible VRAM is capped at the
# 256MB BAR; small KV caches land there and decode collapses (~5 t/s at -c 8192).
# Disabling host-visible vidmem keeps everything in device memory: 4.5x faster
# at small contexts, neutral at large. Always keep this on for TB/no-ReBAR rigs.
vulkan_disable_host_visible_vidmem: true

# Server request slots. opencode is single-stream; 1 slot measured ~+10% decode
# in round 1 (noisy). Set >1 (or 0 = server default of 4) if you want to serve
# concurrent clients instead of maximizing single-stream speed.
parallel_slots: 1

# ---- Staged-run toggles (handy for testing) -------------------------------
download_model: true
pull_image:     true
start_service:  true

# ---- Rootful vs rootless podman ------------------------------------------
# Default is ROOTFUL podman (sudo). Run the playbook with --ask-become-pass (or a
# NOPASSWD sudoers rule). NOTE: rootful podman uses a SEPARATE image store, so the
# image is re-pulled as root on first use. Set false to go back to rootless.
podman_as_root: true

# ---- opencode config output ----------------------------------------------
opencode_provider_id:   qwen-arc
opencode_model_id:      qwen3.8-27b
opencode_provider_name: "Qwen 3.8 27B (Arc B60)"
opencode_config_path:   "{{ playbook_dir }}/opencode.json"
opencode_reasoning:     true              # model emits reasoning_content
opencode_context_limit: "{{ ctx_size }}"  # keep in sync with llama-server -c
opencode_output_limit:  8192
